version: '3.8'
services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=local
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: FAKE_PASSWORD_DO_NOT_USE
      POSTGRES_DB: acme_db
    ports:
      - "5432:5432"
